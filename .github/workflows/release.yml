name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish DateCalc/DateCalc.csproj `
            --configuration Release `
            --runtime win-${{ matrix.architecture }} `
            --self-contained true `
            --output publish/${{ matrix.architecture }} `
            -p:Platform=${{ matrix.architecture }} `
            -p:WindowsPackageType=None `
            -p:EnableMsixTooling=false `
            -p:PublishProfile=
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DArchitecture=${{ matrix.architecture }}" `
            "/DSourceDir=publish\${{ matrix.architecture }}" `
            installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.architecture }}
          path: Installer/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
